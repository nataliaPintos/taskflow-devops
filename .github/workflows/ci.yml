name: CI/CD - TaskFlow DevOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Integração Contínua
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes automatizados
        run: npm run test

      - name: Gerar build
        run: npm run build

  cd:
    name: Entrega Contínua
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t taskflow-devops:latest .

      - name: Validar imagem Docker
        run: docker image inspect taskflow-devops:latest

      - name: Executar container para validação
        run: |
          docker run -d -p 8080:80 --name taskflow-devops taskflow-devops:latest
          sleep 5

      - name: Verificar container
        run: docker ps

      - name: Remover container após validação
        if: always()
        run: |
          docker stop taskflow-devops || true
          docker rm taskflow-devops || true